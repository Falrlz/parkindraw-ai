# Optuna budget and search space for one independent study per drawing type.
training_config: configs/experiments/resnet18.yaml
drawing_types:
  - circle
  - meander
  - spiral

# Controlled compute budget. Re-running a persistent study only fills the
# remaining trials; it does not add another 15 trials.
n_trials: 15
timeout_seconds: null
n_splits: 3
study_seed: 42
study_db: artifacts/optuna.db
output_dir: reports/optimization

# Search space locked by the literature review and project plan.
learning_rate_low: 0.00001
learning_rate_high: 0.01
weight_decay_low: 0.000001
weight_decay_high: 0.01
dropout_low: 0.0
dropout_high: 0.5
dropout_step: 0.1
batch_sizes:
  - 8
  - 16
  - 32

# MedianPruner keeps the first fold as warmup, compares from the second fold,
# and waits for three complete startup trials before pruning becomes active.
pruner_startup_trials: 3
pruner_warmup_steps: 1
