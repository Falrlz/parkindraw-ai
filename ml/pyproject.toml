[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "parkindraw-ml"
version = "0.1.0"
description = "AI-assisted Parkinson's screening through drawing analysis"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [
  { name = "ParkinDraw AI Project" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "mlflow>=2.3,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<4",
  "pillow>=10,<13",
  "pyyaml>=6,<7",
  "scikit-learn>=1.2,<2",
  "torch>=2,<3",
  "torchvision>=0.15,<1",
]

[project.optional-dependencies]
eda = [
  "ipykernel>=6,<7",
  "jupyterlab>=4,<5",
  "seaborn>=0.13,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
  "tests",
]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = [".", "src", "pipelines", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE"]

[tool.pyright]
extraPaths = ["src"]
