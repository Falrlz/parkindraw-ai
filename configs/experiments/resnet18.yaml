# ResNet-18 baseline experiment configuration for Phase 2 training.
# Configures single-drawing hyperparameter baselines, hardware, and dataset paths.

drawing_type: spiral   # circle | meander | spiral
fold: 0                # 0..n_splits-1

# Optimisation
epochs: 30
batch_size: 32
learning_rate: 0.001
weight_decay: 0.0001
dropout: 0.0
early_stopping_patience: 5

# Reproducibility
seed: 42

# Hardware. "auto" selects CUDA when present, otherwise CPU, so renting a GPU
# needs no code change. Raise num_workers on a machine with more cores.
device: auto
num_workers: 0

# Data
raw_dir: data/raw
splits_dir: data/splits
