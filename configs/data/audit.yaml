# Paths are resolved from project_root, which is relative to this config file.
project_root: "../.."
raw_data_dir: "data/raw/newhandpd"
metadata_output_dir: "data/metadata"

supported_extensions:
  - ".jpg"
  - ".jpeg"
  - ".png"

# Artifact values must be filenames. --output-dir controls their destination.
artifacts:
  images_csv: "images.csv"
  subjects_csv: "subjects.csv"
  duplicate_groups_csv: "duplicate_groups.csv"
  near_duplicate_candidates_csv: "near_duplicate_candidates.csv"
  audit_report_json: "audit_report.json"

expected_dataset:
  total_images: 594
  total_subjects: 66
  healthy_subjects: 35
  parkinson_subjects: 31

# dHash is a screening hook, not an automatic duplicate decision.
# Every reported pair must be reviewed before it affects data splitting.
near_duplicate:
  enabled: true
  hash_size: 8
  max_hamming_distance: 2
  same_drawing_type_only: true
  max_reported_candidates: 5000
